[project]
name = "modeler"
version = "0.14.0"
description = "Stock return modeling: feature generation, training, purged cross-validation, and factor evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.5",
    "polars>=1.41",
    "scikit-learn>=1.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "collector",
]

[tool.uv.sources]
collector = { path = "../collector", editable = true }

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "black>=24.0",
    "pytest>=8.0",
    "pandas-stubs~=2.3.3",
]
# 피쳐 생성. 가격 입력이 붙은 뒤에 쓴다.
features = [
    "TA-Lib>=0.7",          # 기술적 지표 (BSD-2, 0.7부터 휠 배포)
    "feature-engine>=1.9",  # 전처리 — sklearn 인터페이스라 누수가 구조적으로 막힌다
    "tsfresh>=0.21",        # 롤링 통계 피쳐
]
# 검증·평가.
eval = [
    "skfolio>=1.0",          # purged CV (mlfinlab 대체)
    "alphalens-reloaded",    # 피쳐 예측력 검증
    "lightgbm>=4.6,<5",      # 기준선 모델
    "matplotlib>=3.8",
]
# 신경망·사전학습 모델 시험(my ml_methods 09의 "나"). 서빙 venv에는 넣지 않는다.
# 사전학습 가중치는 커밋 SHA로 고정한 뒤에만 쓰고(09 §8 Q3), 비상업 라이선스 가중치는 쓰지 않는다(Q2).
dl = [
    "torch>=2.4",                  # 신경망 표 모델·시계열 딥러닝·ETF 샤프 직접 학습
    "xgboost>=2.1",                # 표 형식 비교 모델
    "catboost>=1.2",
    "ngboost>=0.5",                # 분포 예측
    "tabpfn>=2.0",                 # v2 가중치만(ModelVersion.V2). 2.5 이후 가중치는 비상업 약관이라 안 쓴다
    "chronos-forecasting>=2.0",    # Chronos-Bolt·Chronos-2 (apache-2.0)
    "transformers>=4.45",          # 한국어 임베딩(kf-deberta·bge-m3·multilingual-e5)
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "TID"]   # TID 가 없으면 아래 banned-api 가 안 먹는다

# 줄 길이는 포매터(black·ruff format, 100자)가 코드를 맞춘다. 한글 주석·문자열까지
# lint로 막으면 09-21부터 CI가 6주 동안 빨간 채로 남아 경계 검사(TID)까지 묻혔다(2026-11-01).
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# collector.lake 는 여기 없다 — 두 저장소가 공유하는 경로 계약이라 modeler가
# 쓰는 것이 맞다. collector.kr.shared / collector.us.shared 와 같은 자리다.
"collector.kr.adapters".msg = "원천 접근은 collector/의 일이다"
"collector.kr.infra".msg    = "modeler는 DB도 설정도 읽지 않는다"
"collector.kr.service".msg  = "수집 오케스트레이션을 부르지 않는다"
"collector.kr.cli".msg      = "CLI를 부르지 않는다"
# 미국도 같은 경계다. 한쪽에만 lint가 걸려 있으면 그쪽만 지켜진다.
"collector.us.sources".msg  = "원천 접근은 collector/의 일이다"
"collector.us.store".msg    = "스냅샷 쓰기는 수집의 일이다. modeler는 읽기만 한다"
"collector.us.cli".msg      = "CLI를 부르지 않는다"
"collector.us.paths".msg    = "경로는 modeler 자신의 DataRoot로 조립한다"

[tool.ruff.lint.per-file-ignores]
# 2026-11-01 기준 기존 부채(기준선). 새 파일·새 오류는 막는다.
# 그 파일을 고치는 브랜치가 해당 줄을 지우고 오류를 고친다 — 이 목록은 줄어들기만 한다.
"src/modeler/models/_02_updown_prob/experiments/t15_regen.py" = ["I001"]
"src/modeler/reporting/site.py"                               = ["I001"]
"src/modeler/serving/adapters.py"                             = ["F401", "F841"]
"src/modeler/serving/calendars.py"                            = ["UP035", "UP037"]
"src/modeler/serving/daily_coordinator.py"                    = ["I001", "UP037"]
"src/modeler/serving/daily_inputs.py"                         = ["I001"]
"src/modeler/serving/daily_wrapper.py"                        = ["I001"]
"src/modeler/serving/kr_live_prepare.py"                      = ["I001"]
"src/modeler/serving/kr_prepare.py"                           = ["I001"]
"src/modeler/serving/orchestration.py"                        = ["UP017", "UP035", "UP037"]
"src/modeler/serving/runner.py"                               = ["I001", "UP035"]
"src/modeler/serving/runtime_contract.py"                     = ["F841"]
"src/modeler/serving/us_daily.py"                             = ["I001", "UP035"]
"src/modeler/us/features/profitability.py"                    = ["I001"]
"src/modeler/us/features/valuation.py"                        = ["I001"]
"tests/unit/serving/test_adapters_provenance.py"              = ["UP017"]
"tests/unit/serving/test_briefing_wrappers.py"                = ["F541"]
"tests/unit/serving/test_calendar_sources.py"                 = ["I001"]
"tests/unit/serving/test_common_contracts.py"                 = ["UP017"]
"tests/unit/serving/test_common_orchestration.py"             = ["I001"]
"tests/unit/serving/test_daily_inputs.py"                     = ["I001"]
"tests/unit/serving/test_daily_private_view.py"               = ["I001"]
"tests/unit/serving/test_kr_live_prepare.py"                  = ["I001"]
"tests/unit/serving/test_kr_prepare.py"                       = ["F401", "I001"]
"tests/unit/serving/test_provision_serving.py"                = ["I001"]
"tests/unit/serving/test_us_daily.py"                         = ["I001", "UP017"]
"tests/unit/serving/test_us_daily_pinning.py"                 = ["I001"]
"tests/unit/serving/test_us_parity_universe_v2.py"            = ["F401", "I001"]
"tests/unit/serving/test_us_universe_v2_serving.py"           = ["F811", "I001"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeler"]
