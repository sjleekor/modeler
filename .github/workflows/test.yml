name: test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modeler
        uses: actions/checkout@v7
        with:
          path: modeler

      # 경로 의존(`{ path = "../collector", editable = true }`)이 clone만으로는
      # 복원이 안 된다 — collector/를 나란히 checkout해 로컬과 같은 모양을 만든다.
      - name: Checkout collector
        uses: actions/checkout@v7
        with:
          repository: sjleekor/collector
          path: collector

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      # 시험이 lightgbm·skfolio·matplotlib(eval extra)을 직접 import한다. 러너 기본 파이썬(3.14)이
      # 아니라 맥 venv와 같은 3.12로 맞춘다(2026-11-01 — lint가 6주 만에 통과한 뒤 처음 드러남).
      - name: Sync dependencies
        working-directory: modeler
        run: uv sync --python 3.12 --extra dev --extra eval

      - name: Lint (banned-api 포함)
        working-directory: modeler
        run: uv run ruff check src tests

      # feedback 시험은 macOS 경로 /private/tmp를 쓴다(/tmp는 macOS에서 심볼릭 링크라 거부).
      # 러너에 같은 권한(1777)의 실제 디렉터리를 만든다.
      - name: Prepare /private/tmp
        run: sudo mkdir -p /private/tmp && sudo chmod 1777 /private/tmp

      # 서빙 e2e 시험은 운영과 같은 플랫폼(Linux x86_64)이면 서버 실측 runtime manifest를
      # 그대로 쓴다. 러너는 서버가 아니므로 시험 자체의 탈출구로 현재 인터프리터를 잰다.
      - name: Test
        working-directory: modeler
        env:
          DAILY_E2E_PROBE_RUNTIME: "1"
        run: uv run pytest -q
