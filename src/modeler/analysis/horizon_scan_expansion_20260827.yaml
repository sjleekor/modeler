# Separate preregistration for the post-2026-08-23 expansion round.
#
# The base config and its config_hash remain immutable. This overlay appends
# only candidates chosen before any new label/IC/p-value is computed.
extends: horizon_scan_config.yaml
schema_version: 5

preregistration:
  id: expansion_20260827
  registered_at: 2026-08-27
  base_config_hash_prefix: ab0de634
  outcome_blind: true
  notes:
    - N7 KIS values are diagnostic-only and do not enter this registry.
    - N2 industry-neutral values are diagnostic-only because current industry is backfilled.
    - N6 final-vintage families have an evidence-grade cap of B.
    - N8 common macro levels are Phase C regime candidates, not cross-sectional IC families.

phase_b:
  # Existing 38 + mcap 4 + filing-activity 20 + N6 16.
  primary_candidate_count_max: 78

phase_c:
  open_policy: conditional_on_phase_ab_pattern
  holdout_policy: open_once_after_all_selection
  regime_candidates:
    - feature_code: macro_unemployment_rate_level
      source_series_id: macro_unemployment_rate
      transform: level
      availability: period_end_plus_20_calendar_days
      role: conditional_regime_only
    - feature_code: macro_employment_rate_level
      source_series_id: macro_employment_rate
      transform: level
      availability: period_end_plus_20_calendar_days
      role: conditional_regime_only

