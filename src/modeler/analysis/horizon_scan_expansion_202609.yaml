  # --- F-2 statistical peer relations (02 §1, f2 report §6) ----------------
  - family: rel_peer_mom
    phase: B
    fdr_family: relation
    role: phase_b_blocked
    expected_sign: null
    features:
      - {column: rel_peer_mom_20d, role: primary}
      - {column: rel_peer_mom_60d, role: secondary}
    primary_horizon_set: [20, 40, 60]
    exploratory_horizon_set: [1, 2, 3, 5, 10, 120]
    include_bucket_primary: true
    fdr_include: false
    readiness_dependencies: [dim_peer_monthly, feat_relation_stat, label_scan]
